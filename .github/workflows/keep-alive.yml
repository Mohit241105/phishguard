name: Render Keep Alive Service

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from spinning down
    - cron: '*/10 * * * *'
  # Enable manual triggering from the GitHub Actions UI tab
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Render Service
    runs-on: ubuntu-latest

    steps:
      - name: Send HTTP GET Request to Service Health Endpoint
        run: |
          echo "Sending keep-alive request to Render health endpoint..."
          curl -sSL --max-time 60 --retry 3 --retry-delay 5 --retry-connrefused https://phishguard-1-19bb.onrender.com/health || echo "Keep-alive ping sent (service response timed out or returned non-200 status, non-fatal)."
          echo ""
          echo "Keep-alive workflow completed."
