name: Render Keep Alive Service

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from spinning down
    - cron: '*/10 * * * *'
  # Enable manual triggering from the GitHub Actions UI tab
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Render Service
    runs-on: ubuntu-latest

    steps:
      - name: Send HTTP GET Request to Service Root
        run: |
          echo "Sending keep-alive request to Render..."
          curl -sSfL --max-time 30 https://phishguard-1-19bb.onrender.com
          echo ""
          echo "Health check succeeded — Render service is active."
